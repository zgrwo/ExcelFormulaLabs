# ============================================================================
# dependabot.yml — 依赖自动更新
# 使用方式：直接启用（GitHub 自动读取）
#   - nuget: 仓库含 *.sln / *.csproj（本仓库）
#   - github-actions: workflow 文件存在
# ============================================================================
version: 2
updates:
  # --- .NET NuGet 依赖 ---
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    ignore:
      # Microsoft.Data.Sqlite 升级需人工适配 DataToolkit.csproj 的 e_sqlite3.dll
      # 原生资源嵌入路径（SQLitePCLRaw 版本耦合，见 PR#8）——patch/minor 升级同样会
      # 改变 SQLitePCLRaw bundle 版本（P2 审查修复：semver-major → semver-minor）
      - dependency-name: "Microsoft.Data.Sqlite"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # --- GitHub Actions 自身 ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels: ["dependencies"]