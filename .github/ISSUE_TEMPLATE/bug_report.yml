name: Bug 报告
description: 报告可复现的问题
title: "[BUG] 简述问题"
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: 版本号
      placeholder: 如 2.0.1
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: 运行环境
      placeholder: 如 Windows 11 / Excel 365 64 位 / net48 或 net8.0 加载项
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 期望行为与实际行为的差异
      placeholder: 清晰描述期望行为与实际行为的差异
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 最小复现步骤
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      placeholder: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      placeholder: 实际结果（含错误值如 #VALUE! / #NUM!）
    validations:
      required: true
