name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 变更分类（2026-09-23）：docs-only 变更跳过重 job（构建/测试/覆盖率），
  # 但 redline / verify-docs / classify 始终运行——文档变更恰是文档门禁最需要的场景。
  # 分支未设保护规则（skipped job 不阻塞合并）；若未来启用 required checks，
  # 需把跳过语义改为 job 内早退（否则 required check 显示 skipped）。
  classify:
    name: Classify Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # workflow_dispatch（无 before 基线）视为全量：手动触发必须跑全部重 job。
      code: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Detect code changes
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'benchmarks/**'
              - 'scripts/**'
              - 'templates/**'
              - '*.sln'
              - '*.props'
              - '**/*.csproj'
              - '**/packages.lock.json'
              - 'nuget.config'
              - 'requirements.txt'
              - '.github/workflows/**'

  redline-check:
    name: Red-line & Governance Checks
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run pre-commit checks
        run: ./scripts/pre-commit-check.ps1

      - name: Run test quality checks
        run: ./scripts/check-test-quality.ps1

      # 受影响测试映射（信息性，不替代全量测试）：PR 内展示改动源文件 → 测试工程/类路由。
      - name: Affected test mapping (informational)
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $base = "${{ github.event.pull_request.base.sha }}"
          $files = @(git diff --name-only "$base...HEAD")
          if ($files.Count -eq 0) { Write-Host "No changed files."; exit 0 }
          ./scripts/run-affected-tests.ps1 -ChangedFiles $files -DryRun

      - name: 提交规范检查（Conventional Commits）
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          count=0
          for sha in $(git rev-list --no-merges "$base..HEAD"); do
            # dependabot 自动提交（如 "Bump X from Y to Z"）不受 CC 约束
            author=$(git show -s --format=%an "$sha")
            if [ "$author" = "dependabot[bot]" ]; then
              continue
            fi
            count=$((count + 1))
            if ! git show -s --format=%B "$sha" | bash scripts/validate-commit-msg.sh >/dev/null 2>&1; then
              echo "❌ 提交 ${sha:0:7} 不符合 Conventional Commits 规范："
              git show -s --format='   %s' "$sha"
              echo "   规则见 scripts/validate-commit-msg.sh 与 CONTRIBUTING「提交规范」"
              # 重跑一次让具体原因（如标题超长）进入 CI 日志，避免只报「不符合」无从定位
              git show -s --format=%B "$sha" | bash scripts/validate-commit-msg.sh 2>&1 || true
              exit 1
            fi
          done
          echo "✅ 全部 $count 个提交符合规范"

      # R5-P3-31 (review 2026-09-06)：提交规范检查原仅 PR 触发——直推 main 完全绕过校验。
      # push 事件用 github.event.before..SHA 区间逐提交校验（新分支 before 为全零时跳过）。
      - name: 提交规范检查（Conventional Commits，push）
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        shell: bash
        run: |
          before="${{ github.event.before }}"
          # force-push 后旧基线提交在 runner 不可达（fetch-depth:0 只取 refs）——原样会让
          # git rev-list 报 bad revision、循环取空并静默放行 0 个提交（实测 -e 不捕获）。
          # 退化为仅校验本次推送 tip，保持门禁不空转。
          if ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            echo "⚠️ 基线 ${before:0:7} 不可达（force-push？）——退化为仅校验 tip 提交"
            before="$(git rev-parse "${GITHUB_SHA}^")"
          fi
          count=0
          for sha in $(git rev-list --no-merges "${before}..${{ github.sha }}"); do
            author=$(git show -s --format=%an "$sha")
            if [ "$author" = "dependabot[bot]" ]; then
              continue
            fi
            count=$((count + 1))
            if ! git show -s --format=%B "$sha" | bash scripts/validate-commit-msg.sh >/dev/null 2>&1; then
              echo "❌ 直推提交 ${sha:0:7} 不符合 Conventional Commits 规范："
              git show -s --format='   %s' "$sha"
              # 重跑一次让具体原因（如标题超长）进入 CI 日志，避免只报「不符合」无从定位
              git show -s --format=%B "$sha" | bash scripts/validate-commit-msg.sh 2>&1 || true
              exit 1
            fi
          done
          echo "✅ 直推区间 $count 个提交符合规范"

      - name: 治理脚本自测（tests/scripts）
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/scripts/run-tests.ps1

  dependency-audit:
    name: NuGet Lock & Vulnerability Audit
    runs-on: windows-latest
    needs: [classify, redline-check]
    if: needs.classify.outputs.code == 'true'
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json

      # 锁定还原：packages.lock.json 与 csproj 不一致时在此失败（NU1004），
      # 防止依赖在无人察觉下漂移。本地更新 lock 后必须提交。
      - name: Restore (locked mode)
        run: dotnet restore --locked-mode

      # 漏洞审计：--format json 输出与语言环境无关，避免本地化文案导致漏判。
      - name: NuGet vulnerability audit
        shell: pwsh
        run: |
          $raw = dotnet list package --vulnerable --include-transitive --format json 2>&1 | Out-String
          $data = $raw | ConvertFrom-Json
          $hits = @()
          foreach ($p in @($data.projects)) {
            if (-not $p.frameworks) { continue }
            foreach ($f in @($p.frameworks)) {
              foreach ($pkg in @($f.topLevelPackages) + @($f.transitivePackages)) {
                if ($null -eq $pkg) { continue }
                if ($pkg.vulnerabilities -and @($pkg.vulnerabilities).Count -gt 0) {
                  $sev = ($pkg.vulnerabilities | ForEach-Object { $_.severity }) -join ','
                  $hits += "$($p.path) [$($f.framework)] $($pkg.id) $($pkg.resolvedVersion) ($sev)"
                }
              }
            }
          }
          if ($hits.Count -gt 0) {
            Write-Host "Vulnerable package(s) detected:" -ForegroundColor Red
            foreach ($h in $hits) { Write-Host "  - $h" -ForegroundColor Red }
            exit 1
          }
          Write-Host "No vulnerable packages found." -ForegroundColor Green

  test:
    name: Build & Test (Debug, all TFMs)
    runs-on: windows-latest
    needs: [classify, redline-check]
    if: needs.classify.outputs.code == 'true'
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json

      - name: Restore
        run: dotnet restore

      - name: Build (Debug)
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build --verbosity normal

      # 安全回归子集显式门禁（沙箱越界 / ReDoS / SQL 注入 / XXE / 公式注入 / 原生 DLL 完整性）。
      # 全量测试已包含这些用例，此步骤提供独立可见的通过/失败信号（--filter Category=Security）。
      - name: Security regression subset
        run: dotnet test --no-build --filter "Category=Security" --verbosity normal

  test-net48:
    name: Build & Test (Debug, net48)
    runs-on: windows-latest
    needs: [classify, redline-check]
    if: needs.classify.outputs.code == 'true'
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json

      - name: Restore
        run: dotnet restore

      - name: Build (Debug, net48)
        run: |
          dotnet build --no-restore src/Foundation/Foundation.csproj -f net48
          dotnet build --no-restore src/Analytics/Analytics.csproj -f net48
          dotnet build --no-restore src/DataToolkit/DataToolkit.csproj -f net48
          dotnet build --no-restore tests/Foundation.Tests/Foundation.Tests.csproj -f net48
          dotnet build --no-restore tests/Analytics.Tests/Analytics.Tests.csproj -f net48
          dotnet build --no-restore tests/DataToolkit.Tests/DataToolkit.Tests.csproj -f net48

      - name: Test (net48)
        run: |
          dotnet test --no-build tests/Foundation.Tests/Foundation.Tests.csproj -f net48 --verbosity normal
          dotnet test --no-build tests/Analytics.Tests/Analytics.Tests.csproj -f net48 --verbosity normal
          dotnet test --no-build tests/DataToolkit.Tests/DataToolkit.Tests.csproj -f net48 --verbosity normal

  cross-val:
    name: Cross-Validation (Python ↔ C#)
    runs-on: windows-latest
    needs: [classify, test]
    if: needs.classify.outputs.code == 'true'
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # F-26 (review-2026-09-06) 已知边界：restore 缓存键仅含 *.csproj——
      # src/Directory.Build.props 变更（如 TreatWarningsAsErrors）不击穿缓存；
      # 当前无 Directory.Packages.props、props 无包引用，暂安全。
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build CrossValRunner
        run: dotnet build tests/CrossValRunner/CrossValRunner.csproj -c Debug

      - name: Run CrossVal tests
        run: dotnet test --filter "CrossVal" --verbosity normal

      - name: Run verify-manual.py
        run: python scripts/verify-manual.py

  release-build:
    name: Release Build (packaging)
    runs-on: windows-latest
    needs: [classify, test]
    if: needs.classify.outputs.code == 'true'
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        shell: pwsh
        run: |
          # R7-3 (review-2026-09-13)：ExcelDnaPack 偶发瞬时文件锁（Win32Exception 110，
          # Defender 扫描刚写出的 .xll）→ 重试 1 次；真实构建错误重试后仍失败。
          for ($attempt = 1; $attempt -le 2; $attempt++) {
            # 2026-09-23：Release 打包在默认并行（-m）下同项目跨 TFM 并发内建会争抢
            # ExcelDnaPack 资源更新（实测连续 3 次 Win32Exception 5 拒绝访问，-m:1 通过）——
            # 串行构建消除竞态；重试仅兜底瞬时文件锁。
            dotnet build -c Release --no-restore -m:1
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 2) { exit $LASTEXITCODE }
            Write-Host "Build failed (attempt $attempt) - retrying after transient ExcelDnaPack lock..."
            Start-Sleep -Seconds 5
          }

      - name: Test (Release, net8.0)
        run: dotnet test -c Release --no-build --verbosity normal

      - name: Build (Release, net48)
        run: |
          dotnet build --no-restore src/Foundation/Foundation.csproj -c Release -f net48
          dotnet build --no-restore src/Analytics/Analytics.csproj -c Release -f net48
          dotnet build --no-restore src/DataToolkit/DataToolkit.csproj -c Release -f net48
          dotnet build --no-restore tests/Foundation.Tests/Foundation.Tests.csproj -c Release -f net48
          dotnet build --no-restore tests/Analytics.Tests/Analytics.Tests.csproj -c Release -f net48
          dotnet build --no-restore tests/DataToolkit.Tests/DataToolkit.Tests.csproj -c Release -f net48

      - name: Test (Release, net48)
        run: |
          dotnet test --no-build tests/Foundation.Tests/Foundation.Tests.csproj -c Release -f net48 --verbosity normal
          dotnet test --no-build tests/Analytics.Tests/Analytics.Tests.csproj -c Release -f net48 --verbosity normal
          dotnet test --no-build tests/DataToolkit.Tests/DataToolkit.Tests.csproj -c Release -f net48 --verbosity normal

      - name: Verify NuGet pack
        run: dotnet pack src/Foundation/Foundation.csproj -c Release --no-build -o nupkg

  verify-docs:
    name: Verify Docs
    runs-on: ubuntu-latest
    # 文档门禁独立于代码构建（needs redline-check）：docs-only 变更跳过重 job 时
    # verify-docs 仍必须运行——它正是文档变更的验收门禁。
    needs: redline-check
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # P2-2 (review): check 10 (tag == props == CHANGELOG) needs git tags; default
          # fetch-depth:1 made git tag empty, so verify-docs.ps1 Check-Skip counted PASS
          # and the version-consistency gate silently never ran in CI.
          fetch-depth: 0

      - name: Run verify-docs.sh
        run: bash scripts/verify-docs.sh

  coverage:
    name: Coverage Gate (net8.0)
    runs-on: windows-latest
    needs: [classify, test]
    if: needs.classify.outputs.code == 'true'
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json

      - name: Restore
        run: dotnet restore

      # 阈值爬坡（2026-09-23 Phase 3 实测 net8.0 CI 口径：Foundation 96.02% /
      # Analytics 90.2% / DataToolkit 90.18%）。旧阈值 75/50/42 与实际脱节 9~47 个点，
      # 长期形同虚设；新阈值保留 ≥4 个点余量，防抖动误伤。本地复现用 scripts/coverage.ps1。
      - name: Coverage (Foundation)
        run: dotnet test tests/Foundation.Tests -f net8.0 --no-restore -p:CollectCoverage=true -p:CoverletOutputFormat=cobertura -p:CoverletOutput=coverage/foundation -p:Threshold=92 -p:ThresholdType=line -p:ThresholdStat=total -p:Include="[Foundation]*"

      - name: Coverage (Analytics)
        run: dotnet test tests/Analytics.Tests -f net8.0-windows --no-restore -p:CollectCoverage=true -p:CoverletOutputFormat=cobertura -p:CoverletOutput=coverage/analytics -p:Threshold=86 -p:ThresholdType=line -p:ThresholdStat=total -p:Include="[Analytics]*"

      - name: Coverage (DataToolkit)
        run: dotnet test tests/DataToolkit.Tests -f net8.0-windows --no-restore -p:CollectCoverage=true -p:CoverletOutputFormat=cobertura -p:CoverletOutput=coverage/datatoolkit -p:Threshold=86 -p:ThresholdType=line -p:ThresholdStat=total -p:Include="[DataToolkit]*"

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-net8.0
          path: tests/*/coverage/*.cobertura.xml
          if-no-files-found: warn
          retention-days: 14