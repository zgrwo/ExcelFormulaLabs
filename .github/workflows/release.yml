name: Release

on:
  push:
    tags:
      # review-2026-08-30：收紧为 semver 三段（GitHub Actions 过滤为 glob 语义，非正则；
      # `+` 不可作量词，用 `[0-9]*` 等价表达）。阻断 vfoo / v2.2 等非标准 tag 触发发布。
      - 'v[0-9]*.[0-9]*.[0-9]*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  build-test:
    name: Build & Test (Release)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          cache: true
          dotnet-version: |
            8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build -c Release --no-restore

      - name: Test (Release, all TFMs)
        run: dotnet test -c Release --no-build --verbosity normal

  verify-docs:
    name: Verify Docs
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run verify-docs.sh
        run: bash scripts/verify-docs.sh

  cross-val:
    name: Cross-Validation
    runs-on: windows-latest
    needs: build-test
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          cache: true
          dotnet-version: 8.0.x

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build CrossValRunner
        run: dotnet build tests/CrossValRunner/CrossValRunner.csproj -c Release

      - name: Run verify-manual.py
        run: python scripts/verify-manual.py

  pack-release:
    name: Pack & Release
    runs-on: windows-latest
    needs: [cross-val, verify-docs]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          cache: true
          dotnet-version: |
            8.0.x

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Verify version consistency (tag == Directory.Build.props)
        shell: pwsh
        run: |
          $props = [xml](Get-Content src/Directory.Build.props)
          $propsVersion = $props.Project.PropertyGroup.Version
          if ("${{ steps.version.outputs.VERSION }}" -ne $propsVersion) {
            Write-Error "Tag version ${{ steps.version.outputs.VERSION }} does not match Directory.Build.props <Version>$propsVersion</Version>. Bump src/Directory.Build.props before tagging."
            exit 1
          }
          Write-Host "Version OK: $propsVersion"

      - name: Build (Release)
        run: dotnet build -c Release

      - name: Collect XLL artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          # H1 (release-audit-2026-08-29)：必须恰好 8 个 .xll —— 2 模块 × 2 TFM × 2 位数
          $expected = @(
            'Analytics-AddIn-net48-packed.xll',
            'Analytics-AddIn-net48-64-packed.xll',
            'Analytics-AddIn-net8.0-packed.xll',
            'Analytics-AddIn-net8.0-64-packed.xll',
            'DataToolkit-AddIn-net48-packed.xll',
            'DataToolkit-AddIn-net48-64-packed.xll',
            'DataToolkit-AddIn-net8.0-packed.xll',
            'DataToolkit-AddIn-net8.0-64-packed.xll'
          )
          $xlls = @(Get-ChildItem -Recurse -Filter "*-packed.xll" -Path "src" |
            Where-Object { $_.DirectoryName -match "Release" })
          Write-Host "found $($xlls.Count) packed xlls"
          # review-2026-08-29 H1 修复：pwsh7(.NET Core) 下 FileInfo.ToString() 返回全路径而非文件名，
          # 旧写法 `$_.Name -eq $_`（字符串 vs FileInfo 对象）在 pwsh7 恒 false（PS5.1 仅靠 ToString=文件名碰巧成立）。
          # 改纯字符串名比较，PS5.1 / pwsh7 行为一致。
          $foundNames = @($xlls | ForEach-Object { $_.Name })
          $missing = @($expected | Where-Object { $_ -notin $foundNames })
          if ($missing.Count -gt 0) {
            Write-Error "[Collect] 缺少 $($missing.Count) 个产物: $($missing -join ', ') — 构建可能静默失败，中止发布。"
            exit 1
          }
          if ($foundNames.Count -ne $expected.Count) {
            Write-Error "[Collect] 产物数量 $($foundNames.Count) != 期望 $($expected.Count)。"
            exit 1
          }
          $xlls | Copy-Item -Destination artifacts/
          Get-ChildItem artifacts/

      - name: Pack NuGet (Foundation)
        run: dotnet pack src/Foundation/Foundation.csproj -c Release --no-build -o artifacts/nupkg

      - name: Push to GitHub Packages
        shell: pwsh
        run: |
          Get-ChildItem "artifacts/nupkg/*.nupkg" | ForEach-Object {
            dotnet nuget push $_.FullName --source "github" --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate --no-symbols
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "ExcelFormulaLabs ${{ github.ref_name }}"
          body: |
            ## ExcelFormulaLabs ${{ github.ref_name }}

            ### 安装
            下载对应 `.xll` 文件，在 Excel 中加载即可使用。

            > ⚠️ **从 GitHub 下载的 `.xll` 需先「解除锁定」**：右键 `.xll` → 属性 → 底部「安全」区域勾选「解除锁定」→ 确定。否则 Excel 可能报「此文件来自其他计算机，可能被阻止以帮助保护该计算机」（本构件未做数字签名）。

            | 文件 | 框架 | 说明 |
            |------|------|------|
            | Analytics-AddIn-net48-packed.xll / Analytics-AddIn-net48-64-packed.xll | .NET Framework 4.8 | 免安装运行时（×32/64 位，共 2 个） |
            | Analytics-AddIn-net8.0-packed.xll / Analytics-AddIn-net8.0-64-packed.xll | .NET 8 | 性能更优（×32/64 位，共 2 个） |
            | DataToolkit-AddIn-net48-packed.xll / DataToolkit-AddIn-net48-64-packed.xll | .NET Framework 4.8 | 免安装运行时（×32/64 位，共 2 个） |
            | DataToolkit-AddIn-net8.0-packed.xll / DataToolkit-AddIn-net8.0-64-packed.xll | .NET 8 | 性能更优（×32/64 位，共 2 个） |

            详见 [CHANGELOG](CHANGELOG.md)。
          files: artifacts/*.xll
          # H1 (release-audit-2026-08-29)：glob 无匹配即失败，防「Release 无任何 .xll」假成功。
          fail_on_unmatched_files: true
          draft: false
          prerelease: false