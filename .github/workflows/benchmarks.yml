name: Benchmarks

# 性能基准（BenchmarkDotNet）：不进门禁，只留历史趋势与回归证据。
# 触发：main 相关路径变更 + 手动 dispatch + 每周一 03:00 UTC 定时。
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'benchmarks/**'
      - 'ExcelFormulaLabs.sln'
      - '.github/workflows/benchmarks.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmarks:
    name: BenchmarkDotNet (net8.0-windows)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json

      # CI=true → RestoreLockedMode（Directory.Build.props），依赖漂移在 restore 阶段失败。
      - name: Restore
        run: dotnet restore

      # BenchmarkSwitcher：--filter "*" 运行全部基准（Linalg / MapOver / Stats）。
      - name: Run benchmarks
        run: dotnet run -c Release --project benchmarks/ExcelFormulaLabs.Benchmarks -- --filter "*"

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmarkdotnet-artifacts
          path: BenchmarkDotNet.Artifacts/**
          if-no-files-found: warn
          retention-days: 90
