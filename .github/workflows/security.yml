# ============================================================================
# security.yml — CodeQL 安全扫描
# 触发：main 推送 / 每周一凌晨 2 点定时
# 前置：仓库 Settings → Code security → CodeQL 默认设置关闭（避免重复），
#       或保持默认设置启用并删除本文件（二选一）。
# 说明：C# 为编译型语言，autobuild 需要可构建的源码树；本仓库 .sln 在
#       ubuntu 上可构建（src 项目均引用 net48 reference assemblies 包；
#       EnableWindowsTargeting 允许非 Windows 构建 windows TFM）。
#       若 CodeQL autobuild 失败，请在下方 autobuild 步骤改为显式
#       `dotnet build ExcelFormulaLabs.sln`。
# 经验（2026-08-16 实测）：`// codeql[cs/rule-id]` 抑制注释在本仓库
#       codeql-action v4 环境下不生效（上一行/行尾格式均无效，重扫后
#       生成新编号警报）。quality 级警报（constant-condition/path-combine/
#       equality-on-floats/local-shadows-member 等 note/warning）按 dismiss
#       流程处理（false positive / won't fix / used in tests），勿再尝试
#       源码内抑制注释。
# ============================================================================
name: Security

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [csharp]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
